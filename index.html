<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Weather Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(to right top, #74ebd5, #acb6e5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .weather-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px 25px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      color: white;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .search-box {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 10px;
      width: 70%;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: none;
      background-color: #00c9a7;
      color: white;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #00a88a;
    }

    .weather-info {
      display: none;
      margin-top: 20px;
      text-align: center;
    }

    .city-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .temp {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .desc {
      text-transform: capitalize;
      margin-bottom: 10px;
    }

    .weather-icon {
      width: 80px;
      height: 80px;
      margin: 10px auto;
      transition: transform 0.3s ease;
    }

    .weather-icon:hover {
      transform: rotate(10deg);
    }

    .extra-info {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      input[type="text"] {
        width: 60%;
        font-size: 14px;
      }

      button {
        width: 30%;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="weather-container">
    <h1>🌤 Weather Dashboard</h1>
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name" />
      <button onclick="getWeather()">Search</button>
    </div>

    <div class="weather-info" id="weatherInfo">
      <div class="city-name" id="cityName"></div>
      <img src="" alt="Weather Icon" class="weather-icon" id="weatherIcon" />
      <div class="temp" id="temperature"></div>
      <div class="desc" id="description"></div>
      <div class="extra-info">
        <div>Humidity: <span id="humidity"></span>%</div>
        <div>Wind Speed: <span id="windSpeed"></span> m/s</div>
      </div>
    </div>
  </div>

  <script>
    // Enter key support
    document.getElementById("cityInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        getWeather();
      }
    });

    async function getWeather() {
      const city = document.getElementById('cityInput').value.trim();
      const apiKey = '6d7daceed7a2eb200aafb3e1467c8ec6'; // Your API Key
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      const infoDiv = document.getElementById('weatherInfo');
      infoDiv.style.display = 'none';

      if (!city) {
        alert("Please enter a city name");
        return;
      }

      try {
        const response = await fetch(url);

        if (!response.ok) throw new Error("City not found or API error");

        const data = await response.json();

        document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
        document.getElementById('temperature').textContent = Math.round(data.main.temp);
        document.getElementById('description').textContent = data.weather[0].description;
        document.getElementById('humidity').textContent = data.main.humidity;
        document.getElementById('windSpeed').textContent = data.wind.speed;
        document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;

        infoDiv.style.display = 'block';
      } catch (error) {
        alert(error.message);
      }
    }
  </script>

</body>
</html>
