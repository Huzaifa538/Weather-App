<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Weather Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(to right top, #74ebd5, #acb6e5); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .weather-container { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px 25px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25); color: white; }
    h1 { font-size: 24px; margin-bottom: 20px; font-weight: 600; }
    .search-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    input[type="text"] { padding: 12px; border: none; outline: none; border-radius: 10px; width: 70%; font-size: 16px; }
    button { padding: 12px 16px; border: none; background-color: #00c9a7; color: white; font-size: 16px; border-radius: 10px; cursor: pointer; }
    button:hover { background-color: #00a88a; }
    .weather-info { display: none; margin-top: 20px; text-align: center; }
    .city-name { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
    .temp { font-size: 40px; font-weight: bold; margin-bottom: 10px; }
    .desc { text-transform: capitalize; margin-bottom: 10px; }
    .weather-icon { margin: 10px auto; }
    .extra-info { margin-top: 15px; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="weather-container">
    <h1>Weather Dashboard</h1>
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name" />
      <button onclick="getWeather()">Search</button>
    </div>
    <div class="weather-info" id="weatherInfo">
      <div class="city-name" id="cityName"></div>
      <div class="weather-icon" id="weatherIcon" style="font-size:64px;"></div>
      <div class="temp" id="temperature"></div>
      <div class="desc" id="description"></div>
      <div class="extra-info">
        <div>Humidity: <span id="humidity"></span>%</div>
        <div>Wind Speed: <span id="windSpeed"></span> m/s</div>
      </div>
    </div>
  </div>
  <script>
    // Enter key support
    document.getElementById("cityInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") { getWeather(); }
    });
    // weather code to text + emoji
    function weatherInfo(code) {
      if (code === 0) return ["Clear sky", "☀️"];
      if (code <= 3) return ["Partly cloudy", "⛅"];
      if (code <= 48) return ["Foggy", "🌫️"];
      if (code <= 57) return ["Drizzle", "🌦️"];
      if (code <= 67) return ["Rain", "🌧️"];
      if (code <= 77) return ["Snow", "❄️"];
      if (code <= 82) return ["Rain showers", "🌧️"];
      if (code <= 86) return ["Snow showers", "❄️"];
      return ["Thunderstorm", "⛈️"];
    }
    async function getWeather() {
      const city = document.getElementById('cityInput').value.trim();
      const infoDiv = document.getElementById('weatherInfo');
      infoDiv.style.display = 'none';
      if (!city) { alert("Please enter a city name"); return; }
      try {
        // find the city (free, no key needed)
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();
        if (!geoData.results || !geoData.results.length) throw new Error("City not found");
        const place = geoData.results[0];
        // get current weather (free, no key needed)
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`);
        const weatherData = await weatherRes.json();
        const current = weatherData.current;
        const [desc, emoji] = weatherInfo(current.weather_code);
        document.getElementById('cityName').textContent = `${place.name}, ${place.country || ''}`;
        document.getElementById('temperature').textContent = Math.round(current.temperature_2m) + "°C";
        document.getElementById('description').textContent = desc;
        document.getElementById('humidity').textContent = current.relative_humidity_2m;
        document.getElementById('windSpeed').textContent = current.wind_speed_10m;
        document.getElementById('weatherIcon').textContent = emoji;
        infoDiv.style.display = 'block';
      } catch (error) { alert(error.message); }
    }
  </script>
</body>
</html>
